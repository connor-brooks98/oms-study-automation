[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oms-study-automation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "google-api-python-client>=2.180,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "keyring>=25,<26",
  "openpyxl>=3.1,<4",
  "msoffcrypto-tool>=6,<7",
  "notebooklm-py==0.7.3",
  "pyjwt[crypto]>=2.10,<3",
  "pypdf>=6.14,<7",
  "pydantic-settings>=2.7,<3",
  "playwright>=1.55,<2",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "types-openpyxl>=3.1,<4",
]

[project.scripts]
oms-hub = "oms_hub.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oms_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]
markers = ["windows_office: requires Windows with desktop Microsoft Office installed"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["oms_hub"]
