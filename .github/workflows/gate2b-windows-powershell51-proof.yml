name: Gate 2B Windows PowerShell 5.1 proof

on:
  push:
    branches: [codex/gate2b-windows-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell51:
    name: PowerShell 5.1 / ${{ matrix.lane }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: acl-probe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable parent and Windows PowerShell 5.1
        shell: powershell
        run: |
          $Candidate = "331e695c894601af3de925ae0e5253331fe1d4bc"
          git merge-base --is-ancestor $Candidate HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Reviewed integration candidate is not an ancestor of the proof commit."
          }
          $Changed = @(git diff --name-only $Candidate HEAD)
          if ($Changed.Count -ne 1 -or $Changed[0] -ne ".github/workflows/gate2b-windows-powershell51-proof.yml") {
            throw "Proof branch changes content outside the disposable workflow."
          }
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)."
          }

      - name: Probe current-user-only file ACL
        shell: powershell
        run: |
          $Probe = Join-Path $env:RUNNER_TEMP "gate2b-acl-probe"
          [IO.File]::WriteAllText($Probe, "synthetic")
          try {
            $Identity = & whoami.exe /user /fo csv /nh |
              ConvertFrom-Csv -Header Name,Sid
            $IdentityExit = $LASTEXITCODE
            & icacls.exe $Probe /inheritance:r /grant:r "*$($Identity.Sid):(F)" | Out-Null
            $GrantExit = $LASTEXITCODE
            & icacls.exe $Probe /verify | Out-Null
            $VerifyExit = $LASTEXITCODE
            $Acl = Get-Acl -LiteralPath $Probe
            $Rules = @($Acl.GetAccessRules(
                $true, $false, [Security.Principal.SecurityIdentifier]
            ))
            $Current = @($Rules | Where-Object {
                $_.IdentityReference.Value -ceq $Identity.Sid
              })
            [pscustomobject]@{
              identity_exit = $IdentityExit
              sid_valid = [bool]($Identity.Sid -match '^S-1(?:-\d+)+$')
              grant_exit = $GrantExit
              verify_exit = $VerifyExit
              protected = $Acl.AreAccessRulesProtected
              rule_count = $Rules.Count
              current_rule_count = $Current.Count
              other_rule_count = @($Rules | Where-Object {
                  $_.IdentityReference.Value -cne $Identity.Sid
                }).Count
              current_full_control = [bool]($Current.Count -eq 1 -and
                (($Current[0].FileSystemRights -band
                  [Security.AccessControl.FileSystemRights]::FullControl) -eq
                  [Security.AccessControl.FileSystemRights]::FullControl))
              current_inherited = [bool]($Current.Count -eq 1 -and $Current[0].IsInherited)
            } | ConvertTo-Json -Compress
          } finally {
            Remove-Item -LiteralPath $Probe -Force -ErrorAction SilentlyContinue
          }
