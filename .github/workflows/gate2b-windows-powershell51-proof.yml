name: Gate 2B Windows PowerShell 5.1 proof

on:
  push:
    branches: [codex/gate2b-windows-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell51:
    name: PowerShell 5.1 / ${{ matrix.lane }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: native-acl-probe
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable parent and Windows PowerShell 5.1
        shell: powershell
        run: |
          $Candidate = "31fa7a6a217978e20a2b071c9dd4caa5c0378aaf"
          git merge-base --is-ancestor $Candidate HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Reviewed integration candidate is not an ancestor of the proof commit."
          }
          $Changed = @(git diff --name-only $Candidate HEAD)
          if ($Changed.Count -ne 1 -or $Changed[0] -ne ".github/workflows/gate2b-windows-powershell51-proof.yml") {
            throw "Proof branch changes content outside the disposable workflow."
          }
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)."
          }

      - name: Install native ACL dependency
        shell: powershell
        run: |
          py -3.12 -m pip install pywin32==312

      - name: Probe native secure-file API
        shell: powershell
        run: |
          $Probe = Join-Path $env:RUNNER_TEMP "gate2b_native_acl_probe.py"
          [IO.File]::WriteAllText($Probe, @'
          import json
          import msvcrt
          import ntsecuritycon
          import os
          import uuid
          import win32api
          import win32con
          import win32file
          import win32security
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / f"gate2b-{uuid.uuid4().hex}.tmp"
          stage = "token"
          handle = None
          fd = None
          checks = {}
          try:
              token = win32security.OpenProcessToken(
                  win32api.GetCurrentProcess(), win32security.TOKEN_QUERY
              )
              try:
                  sid = win32security.GetTokenInformation(
                      token, win32security.TokenUser
                  )[0]
              finally:
                  token.Close()
              stage = "descriptor"
              dacl = win32security.ACL()
              dacl.AddAccessAllowedAce(
                  win32security.ACL_REVISION, ntsecuritycon.FILE_ALL_ACCESS, sid
              )
              attributes = win32security.SECURITY_ATTRIBUTES()
              attributes.bInheritHandle = False
              attributes.SetSecurityDescriptorDacl(True, dacl, False)
              attributes.SetSecurityDescriptorControl(
                  win32security.SE_DACL_PROTECTED,
                  win32security.SE_DACL_PROTECTED,
              )
              stage = "create"
              handle = win32file.CreateFile(
                  str(path),
                  win32con.GENERIC_READ | win32con.GENERIC_WRITE,
                  0,
                  attributes,
                  win32con.CREATE_NEW,
                  win32con.FILE_ATTRIBUTE_NORMAL,
                  None,
              )
              stage = "inspect"
              descriptor = win32security.GetSecurityInfo(
                  handle,
                  win32security.SE_FILE_OBJECT,
                  win32security.DACL_SECURITY_INFORMATION,
              )
              applied = descriptor.GetSecurityDescriptorDacl()
              control, _revision = descriptor.GetSecurityDescriptorControl()
              ace_count = applied.GetAceCount() if applied is not None else 0
              ace = applied.GetAce(0) if ace_count == 1 else None
              checks = {
                  "dacl_present": applied is not None,
                  "ace_count": ace_count,
                  "protected": bool(control & win32security.SE_DACL_PROTECTED),
                  "type_ok": bool(ace and ace[0][0] == win32security.ACCESS_ALLOWED_ACE_TYPE),
                  "not_inherited": bool(ace and not ace[0][1] & win32security.INHERITED_ACE),
                  "full_access": bool(ace and ace[1] & ntsecuritycon.FILE_ALL_ACCESS == ntsecuritycon.FILE_ALL_ACCESS),
                  "sid_match": bool(ace and win32security.EqualSid(ace[2], sid)),
              }
              stage = "detach"
              raw_handle = int(handle.Detach())
              handle = None
              stage = "crt"
              fd = msvcrt.open_osfhandle(
                  raw_handle,
                  os.O_RDWR | getattr(os, "O_BINARY", 0) | getattr(os, "O_NOINHERIT", 0),
              )
              print(json.dumps({"status": "passed", "checks": checks}, sort_keys=True))
          except BaseException as error:
              print(json.dumps({
                  "status": "failed",
                  "stage": stage,
                  "error_type": type(error).__name__,
                  "winerror": getattr(error, "winerror", None),
                  "checks": checks,
              }, sort_keys=True))
              raise
          finally:
              if fd is not None:
                  os.close(fd)
              elif handle is not None:
                  handle.Close()
              path.unlink(missing_ok=True)
          '@, [Text.UTF8Encoding]::new($false, $true))
          py -3.12 $Probe
