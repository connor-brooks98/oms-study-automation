name: Gate 2B Windows PowerShell 5.1 proof

on:
  push:
    branches: [codex/gate2b-windows-proof]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell51:
    name: PowerShell 5.1 / ${{ matrix.lane }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: contracts-providers
            targets: tests\contracts\test_gate2b_manifest_split.py tests\providers\gemini\test_client.py tests\providers\gemini\test_evidence.py
          - lane: live-contract-mocks
            targets: tests\live\test_gemini_file_search_contract.py
          - lane: composition-harness
            targets: tests\scripts\test_task28_private_shadow_composition.py::test_c5_runs_the_committed_windows_harness_when_available
          - lane: private-evidence-harness
            targets: tests\scripts\test_private_shadow_evidence.py::test_private_shadow_wrapper_runs_committed_synthetic_fault_matrix
          - lane: reconciliation-harness
            targets: tests\scripts\test_gemini_reconciliation_evidence.py::test_python_json_to_powershell_evidence_path_runs_in_committed_harness
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify immutable parent and Windows PowerShell 5.1
        shell: powershell
        run: |
          $Candidate = "dca119d59cccc7b685a7ad278d749f2f6f0fe768"
          git merge-base --is-ancestor $Candidate HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Reviewed integration candidate is not an ancestor of the proof commit."
          }
          $Changed = @(git diff --name-only $Candidate HEAD)
          if ($Changed.Count -ne 1 -or $Changed[0] -ne ".github/workflows/gate2b-windows-powershell51-proof.yml") {
            throw "Proof branch changes content outside the disposable workflow."
          }
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)."
          }

      - name: Install provider-free test dependencies
        shell: powershell
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Run isolated Gate 2B lane
        shell: powershell
        env:
          RUN_LIVE_GEMINI_TESTS: "0"
          RUN_PRIVATE_GEMINI_SHADOW: "0"
        run: |
          $Targets = "${{ matrix.targets }}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)
          & .\.venv\Scripts\python.exe -m pytest -vv --tb=short --maxfail=20 @Targets
