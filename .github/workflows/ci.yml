name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -e ".[dev,document-processing,pdf-inspection]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Pytest
        env:
          # GitHub's Linux runners do not provide an OS credential backend.
          # Tests that exercise credentials inject their own in-memory store.
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: pytest -q -m "not windows_office"

  javascript:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: node --test "tests/js/*.test.js"

  windows-document-processing:
    name: Windows Python 3.12 document processors
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test document processors
        shell: powershell
        env:
          PYTEST_ADDOPTS: -m "not windows_office"
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,document-processing,pdf-inspection]"
          .\.venv\Scripts\python.exe -c "import anydoc, pdf_inspector; print('document processors ready')"
          .\.venv\Scripts\python.exe -m pytest tests\test_office_converter.py tests\document_processing tests\study_generation tests\v2 -q

  windows-rehearsal-preflight:
    # This is a portable source/preflight gate only.  Capsule export and native
    # NUC/Anki acceptance require frozen local data and are intentionally out of scope.
    name: Windows rehearsal source/preflight
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rehearsal test dependencies
        shell: powershell
        run: |
          py -3.12 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev,document-processing,pdf-inspection]"

      - name: Parse rollout PowerShell and check source contract
        shell: powershell
        run: |
          $scriptPaths = @(
            (Resolve-Path "scripts\export-a0-rehearsal-capsule.ps1").Path,
            (Resolve-Path "scripts\deploy-grouped-matching-release.ps1").Path
          )
          foreach ($scriptPath in $scriptPaths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error "${scriptPath}: $($_.Message)" }
              throw "PowerShell parser rejected $scriptPath"
            }
          }

          $tokens = $null
          $errors = $null
          $releaseAst = [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPaths[1], [ref]$tokens, [ref]$errors
          )
          foreach ($functionName in @(
            "Get-AccountSid", "Test-SameAccount", "Assert-NativeSuccess", "Invoke-Git"
          )) {
            $definitions = @($releaseAst.FindAll({
              param($node)
              $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
                $node.Name -ceq $functionName
            }, $true))
            if ($definitions.Count -ne 1) {
              throw "Expected exactly one $functionName definition"
            }
            Invoke-Expression $definitions[0].Extent.Text
          }
          $currentIdentity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          if (-not (Test-SameAccount -Left $currentIdentity.Name -Right $env:USERNAME)) {
            throw "Qualified and short current-account names did not resolve to the same SID"
          }
          $administratorsSid = [System.Security.Principal.SecurityIdentifier]::new("S-1-5-32-544")
          $administratorsAccount = $administratorsSid.Translate([System.Security.Principal.NTAccount]).Value
          if (Test-SameAccount -Left $currentIdentity.Name -Right $administratorsAccount) {
            throw "Current user unexpectedly matched the built-in Administrators group SID"
          }

          $ProjectRoot = (Resolve-Path ".").Path
          $previousErrorActionPreference = $ErrorActionPreference
          try {
            $ErrorActionPreference = "Stop"
            Invoke-Git @("fetch", "--verbose", "origin", "HEAD") | Out-Null
          } finally {
            $ErrorActionPreference = $previousErrorActionPreference
          }

          $parent = Split-Path -Path "C:\Services\oms-study-automation-v2\scripts\deploy-grouped-matching-release.ps1" -Parent
          if ($parent -cne "C:\Services\oms-study-automation-v2\scripts") {
            throw "PowerShell parent-path smoke returned an unexpected value: $parent"
          }

          $captureScript = Join-Path $env:RUNNER_TEMP ("argument-capture-" + [guid]::NewGuid().ToString("N") + ".ps1")
          $captureOutput = Join-Path $env:RUNNER_TEMP ("argument-capture-" + [guid]::NewGuid().ToString("N") + ".json")
          $projectRoot = "C:\Services\OMS Study Hub"
          $dataRoot = "C:\ProgramData\OMS Study Hub"
          try {
          @'
          param([string]$ProjectRoot, [string]$DataRoot, [string]$CapturePath)
          [ordered]@{ file_path=$PSCommandPath; project_root=$ProjectRoot; data_root=$DataRoot } |
            ConvertTo-Json -Compress | Set-Content -LiteralPath $CapturePath -NoNewline -Encoding UTF8
          '@ | Set-Content -LiteralPath $captureScript -NoNewline -Encoding UTF8
            $captureArguments = @(
              "-NoProfile", "-NonInteractive", "-File", "`"$captureScript`"",
              "-ProjectRoot", "`"$projectRoot`"", "-DataRoot", "`"$dataRoot`"",
              "-CapturePath", "`"$captureOutput`""
            )
            $captureProcess = Start-Process -FilePath (Join-Path ([Environment]::SystemDirectory) "WindowsPowerShell\v1.0\powershell.exe") -ArgumentList $captureArguments -PassThru -Wait -WindowStyle Hidden
            if ($captureProcess.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $captureOutput -PathType Leaf)) {
              throw "PowerShell argument capture failed with exit code $($captureProcess.ExitCode)"
            }
            $capture = Get-Content -LiteralPath $captureOutput -Raw | ConvertFrom-Json
            if ($capture.file_path -cne $captureScript -or $capture.project_root -cne $projectRoot -or $capture.data_root -cne $dataRoot) {
              throw "PowerShell argument capture did not preserve a path argument boundary"
            }
          } finally {
            Remove-Item -LiteralPath $captureScript, $captureOutput -Force -ErrorAction SilentlyContinue
          }

          $scriptPath = $scriptPaths[0]

          $source = Get-Content -LiteralPath $scriptPath -Raw
          $required = @(
            "Set-StrictMode -Version Latest",
            "Assert-CleanGitIdentity",
            "Assert-ResolvedDescendant",
            "Get-CimInstance Win32_Process",
            "credentials_exported = `$false",
            "collection_exported = `$false",
            "production_touched = `$false"
          )
          $missing = @($required | Where-Object { -not $source.Contains($_) })
          if ($missing.Count -ne 0) {
            throw "Capsule export source contract is missing: $($missing -join ', ')"
          }

      - name: Smoke PowerShell Base64 Python transport
        shell: powershell
        run: |
          $python = (Resolve-Path ".\.venv\Scripts\python.exe").Path
          $bootstrap = 'import base64,sys;exec(base64.b64decode(sys.argv.pop(1)))'
          function Invoke-EncodedIsolatedPython([string]$Code, [string[]]$Arguments) {
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($Code))
            & $python -I -c $bootstrap $encoded @Arguments
          }
          $code = 'import json,sys; print(json.dumps({"argument":sys.argv[1],"quoted":"yes"}))'
          $output = @(Invoke-EncodedIsolatedPython $code @('argument with spaces'))
          if ($LASTEXITCODE -ne 0) {
            throw "Base64 Python transport smoke failed with exit code $LASTEXITCODE"
          }
          if ($output.Count -ne 1) {
            throw "Base64 Python transport smoke emitted unexpected output"
          }
          $document = $output[0] | ConvertFrom-Json
          if ($document.quoted -ne 'yes' -or $document.argument -ne 'argument with spaces') {
            throw "Base64 Python transport smoke did not preserve quoted code and arguments"
          }

      - name: Lint rehearsal sources
        shell: powershell
        run: |
          .\.venv\Scripts\python.exe -m ruff check src\oms_hub\anki\rehearsal tests\anki\test_rehearsal_capsule.py tests\anki\test_rehearsal_evidence.py tests\anki\test_rehearsal_export.py tests\anki\test_rehearsal_process.py tests\anki\test_rehearsal_regressions.py tests\anki\test_rehearsal_safety.py tests\anki\test_provider_attempt_events.py tests\anki\test_v2_provider_fault_matrix.py tests\anki\test_v2_replay_fault_matrix.py

      - name: Test capsule portability
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest tests\anki\test_rehearsal_capsule.py -q

      - name: Test evidence packaging
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest tests\anki\test_rehearsal_evidence.py -q

      - name: Test capsule export
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest tests\anki\test_rehearsal_export.py -q

      - name: Test process harness
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest tests\anki\test_rehearsal_process.py -q

      - name: Test historical regressions
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest tests\anki\test_rehearsal_regressions.py -q

      - name: Localize and test rehearsal safety
        shell: powershell
        run: |
          $python = (Resolve-Path ".\.venv\Scripts\python.exe").Path
          $runtime = @(& $python -I -S -c "import sys; print(sys._base_executable)")
          if ($LASTEXITCODE -ne 0 -or $runtime.Count -ne 1) {
            throw "could not resolve the direct Python runtime for bounded rehearsal safety pytest"
          }
          $runtime = (Resolve-Path -LiteralPath $runtime[0].Trim()).Path
          $purelib = @(& $python -I -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          if ($LASTEXITCODE -ne 0 -or $purelib.Count -ne 1 -or -not (Test-Path -LiteralPath $purelib[0].Trim() -PathType Container)) {
            throw "could not resolve the virtual-environment dependency path for bounded rehearsal safety pytest"
          }
          $env:PYTHONPATH = "$($purelib[0].Trim());$((Resolve-Path src).Path)"
          $logRoot = Join-Path $env:RUNNER_TEMP "rehearsal-safety-logs"
          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null

          function Stop-BoundedProcessTree {
            param([Parameter(Mandatory = $true)][System.Diagnostics.Process]$Process)
            & taskkill /PID $Process.Id /T /F | Out-Host
            $taskkillExitCode = $LASTEXITCODE
            try {
              $Process.WaitForExit(5000) | Out-Null
            } catch {
              # The final HasExited check below supplies the cleanup postcondition.
            }
            $Process.Refresh()
            if (-not $Process.HasExited) {
              return "taskkill exit code $taskkillExitCode; process tree rooted at PID $($Process.Id) is still running after 5 seconds"
            }
            if ($taskkillExitCode -ne 0) {
              return "taskkill /T exited $taskkillExitCode; root PID $($Process.Id) exited but descendant cleanup is unproven"
            }
            return $null
          }

          function Invoke-BoundedPytest {
            param(
              [Parameter(Mandatory = $true)][string]$Label,
              [Parameter(Mandatory = $true)][string[]]$Arguments,
              [Parameter(Mandatory = $true)][int]$TimeoutSeconds
            )
            $safeLabel = ($Label -replace '[^A-Za-z0-9_.-]', '_')
            $stdout = Join-Path $logRoot "$safeLabel.stdout.log"
            $stderr = Join-Path $logRoot "$safeLabel.stderr.log"
            $process = Start-Process -FilePath $runtime -ArgumentList $Arguments `
              -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            try {
              [IntPtr]$processHandle = $process.Handle
              if ($processHandle -eq [IntPtr]::Zero) {
                throw "process handle was zero"
              }
            } catch {
              $setupFailure = "could not cache pytest process handle: $Label ($($_.Exception.Message); logs: $stdout, $stderr)"
              try {
                $cleanupFailure = Stop-BoundedProcessTree -Process $process
              } catch {
                $cleanupFailure = "process-tree cleanup threw: $($_.Exception.Message)"
              }
              Write-Host "::group::$Label stdout"
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Write-Host "::endgroup::"
              Write-Host "::group::$Label stderr"
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              Write-Host "::endgroup::"
              if ($null -ne $cleanupFailure) {
                throw "$setupFailure; cleanup failure: $cleanupFailure"
              }
              throw $setupFailure
            }
            $deadline = [DateTime]::UtcNow.AddSeconds($TimeoutSeconds)
            while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 200
              $process.Refresh()
            }
            if (-not $process.HasExited) {
              $cleanupFailure = Stop-BoundedProcessTree -Process $process
              Write-Host "::group::$Label stdout"
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Write-Host "::endgroup::"
              Write-Host "::group::$Label stderr"
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              Write-Host "::endgroup::"
              $timeout = "pytest timed out after $TimeoutSeconds seconds: $Label (logs: $stdout, $stderr)"
              if ($null -ne $cleanupFailure) {
                throw "$timeout; cleanup failure: $cleanupFailure"
              }
              throw $timeout
            }
            try {
              $process.WaitForExit()
              $rawExitCode = $process.ExitCode
              if ($null -eq $rawExitCode) {
                throw "process exit code was null"
              }
              [int]$exitCode = $rawExitCode
            } catch {
              Write-Host "::group::$Label stdout"
              Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
              Write-Host "::endgroup::"
              Write-Host "::group::$Label stderr"
              Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
              Write-Host "::endgroup::"
              throw "pytest exited but its final exit code could not be read: $Label ($($_.Exception.Message); logs: $stdout, $stderr)"
            }
            Write-Host "::group::$Label stdout"
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            Write-Host "::group::$Label stderr"
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            if ($exitCode -ne 0) {
              throw "pytest failed with exit code ${exitCode}: $Label (logs: $stdout, $stderr)"
            }
          }

          $collected = & $runtime -m pytest tests\anki\test_rehearsal_safety.py --collect-only -q -o addopts=''
          if ($LASTEXITCODE -ne 0) {
            throw "pytest collection failed for rehearsal safety"
          }
          $nodePattern = '^tests[\\/]anki[\\/]test_rehearsal_safety\.py::'
          $summaryPattern = '^\d+ tests? collected(?: in .+)?$'
          $unexpected = @($collected | Where-Object {
            $_.Trim() -and $_ -notmatch $nodePattern -and $_ -notmatch $summaryPattern
          })
          if ($unexpected.Count -ne 0) {
            throw "unexpected rehearsal safety collection output: $($unexpected -join ' | ')"
          }
          $summaries = @($collected | Where-Object { $_ -match $summaryPattern })
          if ($summaries.Count -ne 1) {
            throw "expected exactly one rehearsal safety collection summary, received $($summaries.Count)"
          }
          $summaryCount = [int]([regex]::Match($summaries[0], '^\d+').Value)
          $tests = @($collected | Where-Object { $_ -match $nodePattern })
          if ($tests.Count -eq 0) {
            throw "pytest collection yielded no rehearsal safety node IDs"
          }
          $uniqueTests = @($tests | Sort-Object -Unique)
          if ($uniqueTests.Count -ne $tests.Count) {
            throw "pytest collection yielded duplicate rehearsal safety node IDs"
          }
          if ($summaryCount -ne $tests.Count) {
            throw "pytest collection summary count $summaryCount does not match $($tests.Count) node IDs"
          }
          foreach ($test in $tests) {
            Invoke-BoundedPytest -Label $test -Arguments @("-m", "pytest", $test, "-q") -TimeoutSeconds 90
          }
          Invoke-BoundedPytest -Label "tests/anki/test_rehearsal_safety.py (aggregate)" `
            -Arguments @("-m", "pytest", "tests\anki\test_rehearsal_safety.py", "-q") -TimeoutSeconds 180

      - name: Test provider attempt events
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest tests\anki\test_provider_attempt_events.py -q

      - name: Test provider fault matrix
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest tests\anki\test_v2_provider_fault_matrix.py -q

      - name: Test replay fault matrix
        shell: powershell
        run: .\.venv\Scripts\python.exe -m pytest tests\anki\test_v2_replay_fault_matrix.py -q

      - name: Test aggregate cross-file lifecycle
        shell: powershell
        run: |
          $python = (Resolve-Path ".\.venv\Scripts\python.exe").Path
          $runtime = @(& $python -I -S -c "import sys; print(sys._base_executable)")
          if ($LASTEXITCODE -ne 0 -or $runtime.Count -ne 1) {
            throw "could not resolve the direct Python runtime for aggregate rehearsal lifecycle pytest"
          }
          $runtime = (Resolve-Path -LiteralPath $runtime[0].Trim()).Path
          $purelib = @(& $python -I -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          if ($LASTEXITCODE -ne 0 -or $purelib.Count -ne 1 -or -not (Test-Path -LiteralPath $purelib[0].Trim() -PathType Container)) {
            throw "could not resolve the virtual-environment dependency path for aggregate rehearsal lifecycle pytest"
          }
          $env:PYTHONPATH = "$($purelib[0].Trim());$((Resolve-Path src).Path)"
          $stdout = Join-Path $env:RUNNER_TEMP "rehearsal-lifecycle.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "rehearsal-lifecycle.stderr.log"
          function Stop-BoundedProcessTree {
            param([Parameter(Mandatory = $true)][System.Diagnostics.Process]$Process)
            & taskkill /PID $Process.Id /T /F | Out-Host
            $taskkillExitCode = $LASTEXITCODE
            try {
              $Process.WaitForExit(5000) | Out-Null
            } catch {
              # The final HasExited check below supplies the cleanup postcondition.
            }
            $Process.Refresh()
            if (-not $Process.HasExited) {
              return "taskkill exit code $taskkillExitCode; process tree rooted at PID $($Process.Id) is still running after 5 seconds"
            }
            if ($taskkillExitCode -ne 0) {
              return "taskkill /T exited $taskkillExitCode; root PID $($Process.Id) exited but descendant cleanup is unproven"
            }
            return $null
          }
          $arguments = @(
            "-m", "pytest",
            "tests\anki\test_rehearsal_capsule.py",
            "tests\anki\test_rehearsal_evidence.py",
            "tests\anki\test_rehearsal_export.py",
            "tests\anki\test_rehearsal_process.py",
            "tests\anki\test_rehearsal_regressions.py",
            "tests\anki\test_rehearsal_safety.py",
            "tests\anki\test_provider_attempt_events.py",
            "tests\anki\test_v2_provider_fault_matrix.py",
            "tests\anki\test_v2_replay_fault_matrix.py", "-q"
          )
          $process = Start-Process -FilePath $runtime -ArgumentList $arguments `
            -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            [IntPtr]$processHandle = $process.Handle
            if ($processHandle -eq [IntPtr]::Zero) {
              throw "process handle was zero"
            }
          } catch {
            $setupFailure = "could not cache aggregate rehearsal lifecycle pytest process handle: $($_.Exception.Message) (logs: $stdout, $stderr)"
            try {
              $cleanupFailure = Stop-BoundedProcessTree -Process $process
            } catch {
              $cleanupFailure = "process-tree cleanup threw: $($_.Exception.Message)"
            }
            Write-Host "::group::aggregate rehearsal lifecycle stdout"
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            Write-Host "::group::aggregate rehearsal lifecycle stderr"
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            if ($null -ne $cleanupFailure) {
              throw "$setupFailure; cleanup failure: $cleanupFailure"
            }
            throw $setupFailure
          }
          $deadline = [DateTime]::UtcNow.AddSeconds(600)
          while (-not $process.HasExited -and [DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Milliseconds 200
            $process.Refresh()
          }
          if (-not $process.HasExited) {
            $cleanupFailure = Stop-BoundedProcessTree -Process $process
            Write-Host "::group::aggregate rehearsal lifecycle stdout"
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            Write-Host "::group::aggregate rehearsal lifecycle stderr"
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            $timeout = "aggregate rehearsal lifecycle pytest timed out after 600 seconds (logs: $stdout, $stderr)"
            if ($null -ne $cleanupFailure) {
              throw "$timeout; cleanup failure: $cleanupFailure"
            }
            throw $timeout
          }
          try {
            $process.WaitForExit()
            $rawExitCode = $process.ExitCode
            if ($null -eq $rawExitCode) {
              throw "process exit code was null"
            }
            [int]$exitCode = $rawExitCode
          } catch {
            Write-Host "::group::aggregate rehearsal lifecycle stdout"
            Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            Write-Host "::group::aggregate rehearsal lifecycle stderr"
            Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            throw "aggregate rehearsal lifecycle pytest exited but its final exit code could not be read: $($_.Exception.Message) (logs: $stdout, $stderr)"
          }
          Get-Content -LiteralPath $stdout -ErrorAction SilentlyContinue
          Get-Content -LiteralPath $stderr -ErrorAction SilentlyContinue
          if ($exitCode -ne 0) {
            throw "aggregate rehearsal lifecycle pytest failed with exit code $exitCode (logs: $stdout, $stderr)"
          }
