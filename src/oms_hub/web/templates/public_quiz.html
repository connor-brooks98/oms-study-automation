<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#273958">
  <title>{{ quiz.title }} · Study Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/quizzes/assets/player.css">
</head>
<body class="public-quiz-page">
  <a class="skip-link" href="#quiz-player">Skip to quiz</a>
  <nav class="quiz-app"><a href="{{ library_url }}" aria-label="{{ library_label }}">← {{ library_label }}</a></nav>
  <main
    id="quiz-player"
    class="quiz-app"
    tabindex="-1"
    data-quiz-token="{{ quiz.token }}"
    data-quiz-version="{{ quiz.version }}"
    data-content-url="{{ content_url }}"
    data-answer-url="{{ answer_url }}"
  >
    <section class="quiz-loading" aria-live="polite">
      <p class="quiz-brand">Study Hub</p>
      <h1>{{ quiz.title }}</h1>
      <p>
        {{ quiz_context.subject }} · Exam {{ quiz_context.exam_number }}{% if quiz_context.lecture_number is not none %} · Lecture {{ quiz_context.lecture_number }}{% endif %}
      </p>
      <p>Loading quiz…</p>
    </section>
  </main>
  <script src="/public/quizzes/assets/player.js" defer></script>
</body>
</html>
