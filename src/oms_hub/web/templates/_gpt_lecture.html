<form data-gpt-quiz-form>
  <label class="sh-field-label" for="quiz-instructions">Quiz instructions <span class="muted">(optional)</span></label>
  <textarea class="sh-textarea" id="quiz-instructions" name="instructions" rows="3" maxlength="4000" aria-describedby="quiz-instructions-help" placeholder="Only slides 2–6, or only text in red"></textarea>
  <p class="field-help" id="quiz-instructions-help">Leave blank for the full lecture. For PDFs, use “only pages 2–6”. Red-only requests require readable PowerPoint text formatting.</p>
  <button class="button primary sh-btn sh-btn--primary" type="submit">Generate lecture quiz</button>
</form>
<p class="field-help">Uses this lecture’s current materials and cleaned transcript. Questions are saved to this course and exam for review.</p>
<p class="field-message" data-gpt-message role="status" aria-live="polite"></p>
<a class="button secondary sh-btn sh-btn--secondary" data-gpt-review hidden>Open question review</a>
<noscript><p>Enable JavaScript to generate a lecture quiz.</p></noscript>
