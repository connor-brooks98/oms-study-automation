<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#273958">
  <title>{{ run.label }} preview · Study Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/reset.css?v={{ player_asset_version }}">
  <link rel="stylesheet" href="/static/tokens.css?v={{ player_asset_version }}">
  <link rel="stylesheet" href="/static/study-hub.css?v={{ player_asset_version }}">
  <link rel="stylesheet" href="/static/public_quiz.css?v={{ player_asset_version }}">
</head>
<body class="sh-app public-quiz-page">
  <a class="skip-link" href="#quiz-player">Skip to quiz</a>
  <nav class="quiz-app sh-container--narrow"><a class="sh-btn sh-btn--secondary" href="/studio/runs/{{ run.id }}/review">← Back to review</a></nav>
  <section
    class="quiz-app studio-preview-actions sh-container--narrow sh-card"
    data-studio-preview
    data-publish-url="{{ publish_url }}"
  >
    <div class="studio-preview-copy">
      <p class="sh-eyebrow">Final check</p>
      <p><strong>Private preview</strong> · work through the questions below before releasing them.</p>
      <p data-publish-message data-toast-source aria-live="polite"></p>
    </div>
    <button class="quiz-primary sh-btn sh-btn--primary sh-btn--stateful" data-state="idle" type="button" data-publish-quiz>Publish quiz</button>
  </section>
  <main
    id="quiz-player"
    class="quiz-app sh-container--narrow"
    tabindex="-1"
    data-quiz-token="preview-{{ run.id }}"
    data-quiz-version="1"
    data-content-url="{{ content_url }}"
    data-answer-url="{{ answer_url }}"
    data-allow-unanswered-navigation="true"
  >
    <section class="quiz-loading t-skeleton" aria-live="polite">
      <p class="quiz-brand">Study Hub</p>
      <h1 class="sh-title">{{ run.label }}</h1>
      <p>{{ run.destination_subject }} · Exam {{ run.destination_exam_number }}</p>
      <p>Loading preview…</p>
    </section>
  </main>
  <div class="t-toast-region" data-toast-region aria-label="Notifications"></div>
  <script src="/static/public_quiz.js?v={{ player_asset_version }}" defer></script>
  <script src="/static/study_hub_shell.js?v={{ player_asset_version }}" defer></script>
  <script src="/static/studio_quiz_preview.js" defer></script>
</body>
</html>
