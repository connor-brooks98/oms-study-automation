{% extends "base.html" %}
{% block content %}
<section class="page-shell sh-container--narrow artifact-text">
  <a class="artifact-back" href="/">← Back to dashboard</a>
  <header class="artifact-text-heading sh-header">
    <h1 class="sh-title">{{ title }}</h1>
    {% if download_url %}
    <a class="button primary sh-btn sh-btn--primary" href="{{ download_url }}">Download transcript</a>
    {% endif %}
  </header>
  <pre>{{ content }}</pre>
</section>
{% endblock %}
