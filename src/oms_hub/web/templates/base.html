<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#273958">
  <title>{% block title %}Study Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/reset.css">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/study-hub.css">
  <link rel="stylesheet" href="/static/app.css?v=20260810.1">
</head>
<body class="sh-app">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% set current_path = request.url.path %}
  <header class="site-header">
    <nav class="utility-nav sh-nav" aria-label="Primary navigation">
      <a class="sh-nav__link {% if current_path == '/' %}sh-nav__link--active{% endif %}" href="/" {% if current_path == "/" %}aria-current="page"{% endif %}>Dashboard</a>
      <a class="sh-nav__link {% if current_path == '/uploads/slides' %}sh-nav__link--active{% endif %}" href="/uploads/slides" {% if current_path == "/uploads/slides" %}aria-current="page"{% endif %}>Slides</a>
      <a class="sh-nav__link {% if current_path == '/uploads/transcripts' %}sh-nav__link--active{% endif %}" href="/uploads/transcripts" {% if current_path == "/uploads/transcripts" %}aria-current="page"{% endif %}>Transcripts</a>
      <a class="sh-nav__link {% if current_path.startswith('/quarantine') %}sh-nav__link--active{% endif %}" href="/quarantine" {% if current_path.startswith("/quarantine") %}aria-current="page"{% endif %}>Quarantine</a>
      <a class="sh-nav__link {% if current_path.startswith('/review') %}sh-nav__link--active{% endif %}" href="/review" {% if current_path.startswith("/review") %}aria-current="page"{% endif %}>Review</a>
      <a class="sh-nav__link {% if current_path == '/anki' %}sh-nav__link--active{% endif %}" href="/anki" {% if current_path == "/anki" %}aria-current="page"{% endif %}>Anki</a>
      <a class="sh-nav__link {% if current_path.startswith('/studio') %}sh-nav__link--active{% endif %}" href="/studio" {% if current_path.startswith("/studio") %}aria-current="page"{% endif %}>Quiz Builder</a>
      <a class="sh-nav__link {% if current_path.startswith('/public/quizzes') %}sh-nav__link--active{% endif %}" href="/public/quizzes" {% if current_path.startswith("/public/quizzes") %}aria-current="page"{% endif %}>Quizzes</a>
      <a class="sh-nav__link {% if current_path.startswith('/public/practice-questions') %}sh-nav__link--active{% endif %}" href="/public/practice-questions" {% if current_path.startswith("/public/practice-questions") %}aria-current="page"{% endif %}>Practice Questions</a>
      <a class="sh-nav__link {% if current_path.startswith('/settings') %}sh-nav__link--active{% endif %}" href="/settings" {% if current_path.startswith("/settings") %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    <div class="brand-bar sh-brand">
      <a class="brand sh-brand__name" href="/" aria-label="Study Hub dashboard">
        <span class="brand-mark sh-brand__tile" aria-hidden="true">SH</span>
        <span>Study Hub</span>
      </a>
      <span class="nuc-state sh-pill sh-pill--ok sh-syspill"><span class="nuc-state__dot" aria-hidden="true"></span>NUC online</span>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
