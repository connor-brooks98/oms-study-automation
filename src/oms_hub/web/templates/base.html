<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#273958">
  <title>{% block title %}Study Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=20260804.1">
  <link rel="stylesheet" href="/static/tokens.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% set current_path = request.url.path %}
  <header class="site-header">
    <nav class="utility-nav" aria-label="Primary navigation">
      <a href="/" {% if current_path == "/" %}aria-current="page"{% endif %}>Dashboard</a>
      <a href="/uploads/slides" {% if current_path == "/uploads/slides" %}aria-current="page"{% endif %}>Slides</a>
      <a href="/uploads/transcripts" {% if current_path == "/uploads/transcripts" %}aria-current="page"{% endif %}>Transcripts</a>
      <a href="/quarantine" {% if current_path.startswith("/quarantine") %}aria-current="page"{% endif %}>Quarantine</a>
      <a href="/review" {% if current_path.startswith("/review") %}aria-current="page"{% endif %}>Review</a>
      <a href="/anki" {% if current_path == "/anki" %}aria-current="page"{% endif %}>Anki</a>
      <a href="/studio" {% if current_path.startswith("/studio") %}aria-current="page"{% endif %}>Quiz Builder</a>
      <a href="/public/quizzes" {% if current_path.startswith("/public/quizzes") %}aria-current="page"{% endif %}>Quiz Library</a>
      <a href="/settings" {% if current_path.startswith("/settings") %}aria-current="page"{% endif %}>Settings</a>
    </nav>
    <div class="brand-bar">
      <a class="brand" href="/" aria-label="Study Hub dashboard">
        <span class="brand-mark" aria-hidden="true">SH</span>
        <span>Study Hub</span>
      </a>
      <span class="nuc-state"><span aria-hidden="true"></span>NUC online</span>
    </div>
  </header>
  <main id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
